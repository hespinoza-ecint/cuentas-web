<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Cuentas — asistente financiero personal" />
    <title>Cuentas</title>
    <script>
      // Aplica el tema antes del primer render para evitar el destello claro.
      // Debe coincidir con la lógica de src/lib/theme.ts.
      ;(function () {
        try {
          var pref = localStorage.getItem('cuentas.theme')
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          // Sin localStorage: se mantiene el tema del sistema.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
